name: Azure Functions CI/CD

# This is the main CI/CD pipeline for ODW Azure Functions
parameters:
# User-specified environment to deploy to
- name: env
  default: 'build'
  values:
  - 'build'
  - 'dev'
  - 'test'
  - 'prod'

# Run when Pull Request raised to the main branch
pr:
- main

# Run when merged into main
trigger:
 branches:
  include:
  - main

variables:
- name: env
  # If the pipeline was triggered by a merge, and the source branch is the main branch
  ${{ if and(eq(variables['Build.Reason'], 'IndividualCI'), eq(variables['Build.SourceBranch'], 'refs/heads/main')) }}:
    value: test
  ${{ else }}:
    value: ${{ parameters.env }}
- name: variableGroupName
  ${{ if eq(variables.env, 'prod') }}:
    value: "Terraform Prod"
  ${{ elseif eq(variables.env, 'test') }}:
    value: "Terraform Test"
  ${{ elseif eq(variables.env, 'build') }}:
    value: "Terraform Build"
  ${{ else }}:
    value: "Terraform Dev"
- name: agentPool
  value: 'pins-agent-pool-odw-${{ variables.env }}-uks'
- group: ${{ variables.variableGroupName }}

stages:
- stage: TestFunctions
  displayName: 'Test Azure Functions'
  jobs:
  - job: UnitAndIntegrationTests
    displayName: 'Run unit and integration tests'
    pool: ${{ variables.agentPool }}
    steps:
    - checkout: self
      displayName: 'Checkout repo'

    - bash: |
        set -e
        python3 --version
        python3 -m venv "$(Agent.TempDirectory)/odw-functions-test-venv"
        source "$(Agent.TempDirectory)/odw-functions-test-venv/bin/activate"
        python -m pip install -r functions/requirements.txt -r functions/tests/requirements.txt
        mkdir -p "$(Common.TestResultsDirectory)"
        cd functions
        python -m pytest tests/unit tests/integration \
          --cov=entity_registry \
          --cov=function_app \
          --cov=sb_wake_drain_processor \
          --cov=servicebus_funcs \
          --cov=set_environment \
          --cov=validate_messages \
          --cov=var_funcs \
          --cov-branch \
          --cov-report=term-missing \
          --cov-report=xml:$(Common.TestResultsDirectory)/functions-coverage.xml \
          --cov-fail-under=100 \
          --junitxml=$(Common.TestResultsDirectory)/functions-test-results.xml
      displayName: 'Install test dependencies and run coverage tests'

    - task: PublishTestResults@2
      displayName: 'Publish Functions test results'
      condition: succeededOrFailed()
      inputs:
        testResultsFiles: '$(Common.TestResultsDirectory)/functions-test-results.xml'
        testRunTitle: 'ODW Azure Functions tests - $(Build.BuildId) - $(Build.SourceBranch)'
        mergeTestResults: true

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Functions coverage'
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: '$(Common.TestResultsDirectory)/functions-coverage.xml'
        pathToSources: '$(Build.SourcesDirectory)/functions'

- template: stages/wait-for-approval.yaml

- template: stages/deploy-function-app.yaml
  parameters:
    agentPool: ${{ variables.agentPool }}
    env: ${{ variables.env }}
